<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 할 일</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">하나씩, 차근차근</p>
        <h1>오늘의 할 일<span aria-hidden="true">.</span></h1>
        <p class="intro">작은 실천으로 가벼운 하루를 만들어 보세요.</p>
      </header>
      <section class="todo-panel" aria-label="할 일 관리">
        <form id="todo-form">
          <label for="todo-input">새로운 할 일</label>
          <div class="input-row">
            <input id="todo-input" type="text" placeholder="어떤 일을 해볼까요?" maxlength="200" autocomplete="off" required aria-describedby="input-error">
            <button class="add-button" type="submit">추가 <span aria-hidden="true">＋</span></button>
          </div>
          <p id="input-error" class="error" role="alert"></p>
        </form>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="할 일 필터">
            <button type="button" data-filter="all" aria-pressed="true">전체</button>
            <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button type="button" data-filter="completed" aria-pressed="false">완료</button>
          </div>
          <p id="count" class="count"></p>
        </div>
        <ul id="todo-list" aria-label="할 일 목록"></ul>
        <div id="empty-state" class="empty-state">
          <span class="empty-icon" aria-hidden="true">✓</span>
          <p id="empty-title"></p>
          <span id="empty-description"></span>
        </div>
        <footer class="panel-footer">
          <p id="progress"></p>
          <button id="clear-completed" type="button" disabled>완료한 일 삭제</button>
        </footer>
      </section>
      <p class="storage-note">할 일은 이 브라우저에 자동으로 저장됩니다.</p>
      <p id="storage-error" class="error" role="alert"></p>
      <p id="status" class="sr-only" role="status"></p>
    </main>
  </body>
</html>
